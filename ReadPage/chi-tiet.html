<!DOCTYPE html>
<html lang="vi" style="font-family: Arial, Helvetica, sans-serif;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="img/logo-PTEWS.svg">
    <title>Chi tiet</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="chi-tiet.css">
    <link rel="stylesheet" href="footer.css">
    <style>
        :root {
            --BackColor: #ffffff;
            --LinkColor: #bb0000;
            --HeaderColor: #111827;
            --TextColor: #374151;
            --TextMuted: #6b7280;
            --FontNavSize: 14px;
            --FontFamilyBB: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
    </style>
    <script src="js/amlich.js"></script>
    <script src="js/header.js"></script>
</head>

<body>
    <header id="header1-placeholder"></header>
    <nav class="sub-header1" id="header2-placeholder"></nav>

    <div class="ad-background-wrapper"></div>
    <div class="main-container">
        <div id="placeholder"></div>
    </div>

    <footer id="footer-placeholder"></footer>
    <script>
        fetch('header_1.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header1-placeholder').innerHTML = data;
                initHeader();
            });
        fetch('header_2.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header2-placeholder').innerHTML = data;
                if (typeof loadSubHeaderCategories === 'function') {
                    loadSubHeaderCategories();
                }
            });
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            const container = document.getElementById('placeholder');

            // Báo lỗi nếu URL không có ID
            if (!articleId) {
                container.innerHTML = '<p>Lỗi: Thiếu ID bài viết!</p>';
                return;
            }

            try {
                // 2. Gọi API backend
                const response = await fetch(`/api/chitietbaibao?id=${articleId}`);

                if (!response.ok) {
                    const errorData = await response.json();
                    container.innerHTML = `<p>${errorData.message || 'Không tìm thấy bài viết'}</p>`;
                    return;
                }

                const article = await response.json();

                // --- BẮT ĐẦU PHẦN XỬ LÝ NỘI DUNG VÀ CHÈN ẢNH ---
                let htmlContent = article.NoiDung || ''; // Tránh lỗi nếu NoiDung bị null/undefined

                // 1. Thay thế [anh_X] thành thẻ <img> kèm theo <figcaption>
                htmlContent = htmlContent.replace(/\[anh_(\d+)\]/g, function (match, idAnh) {
                    let linkAnh = article[`Anh${idAnh}`];
                    let captionAnh = article[`Caption${idAnh}`]; // Lấy chú thích ảnh từ backend

                    if (linkAnh) {
                        return `<figure class="article-image" style="text-align: center; margin: 15px 0;">
                        <img src=".${linkAnh}" alt="${captionAnh || 'Ảnh minh họa ' + idAnh}" style="max-width: 100%; height: auto; border-radius: 5px;">
                        ${captionAnh ? `<figcaption style="font-family: Arial, Helvetica, sans-serif;font-size: 13px; color: #555; margin-top: 6px; font-style: italic;">${captionAnh}</figcaption>` : ''}
                        </figure>`;
                    }
                    return '';
                });


                // 2. Xử lý xuống dòng \r\n thành các đoạn văn <p>
                htmlContent = htmlContent.split('\r\n\r\n').map(paragraph => {
                    if (paragraph.includes('<img')) return paragraph;
                    return `<p>${paragraph.replace(/\r\n/g, '<br>')}</p>`;
                }).join('');
                // --- KẾT THÚC PHẦN XỬ LÝ NỘI DUNG ---


                // 3. Render dữ liệu vào HTML
                container.innerHTML = `
        <div class="article-header" style="font-family: Arial, Helvetica, sans-serif;">
            <h1>${article.TieuDe}</h1>
            
            <p style="color: gray; font-size: 14px;margin-top:10px;text-align:right;">
                Đăng lúc: 
                ${new Date(article.NgayDang.replace('Z', '')).toLocaleString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                })}
            </p>
            
        </div>
        
        <article id="TomTatNoiDung" style="font-family: Arial, Helvetica, sans-serif;margin-top: 10px; line-height: 1.6;">
            ${article.TomTat}
        </article>
        
        <div class="article-content" style="font-family: Arial, Helvetica, sans-serif; margin-top: 10px; line-height: 1.6; text-align: justify;">
            ${htmlContent}
        </div>
        `;

                document.title = article.TieuDe;

            } catch (error) {
                console.error("Lỗi khi tải chi tiết bài báo:", error);
                container.innerHTML = '<p>Đã xảy ra lỗi khi kết nối với máy chủ!</p>';
            }
        });
    
        // Tải và hiển thị quảng cáo Vị trí 3 (In-article Background)
        async function loadArticleAd() {
            const defaultAd3 = 'AD_file/ad3-in-article-banner.svg';
            const bgWrapper = document.querySelector('.ad-background-wrapper');
            if (!bgWrapper) return;

            let ad3Data = null;
            try {
                const response = await fetch('/api/auth-doanhnghiep/active-ads');
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data && result.data[3]) {
                        ad3Data = result.data[3];
                    }
                }
            } catch (err) {
                console.warn('Không tải được quảng cáo vị trí 3, dùng ảnh mặc định:', err);
            }

            const adUrl = (ad3Data && ad3Data.media_url) ? ad3Data.media_url : defaultAd3;
            bgWrapper.style.backgroundImage = `url('${adUrl}')`;
            bgWrapper.style.backgroundRepeat = 'no-repeat';
            bgWrapper.style.backgroundPosition = 'center top';
            bgWrapper.style.backgroundSize = 'cover';

            const adTarget = (ad3Data && ad3Data.target_url) ? ad3Data.target_url : 'connect-to-ad.html';
            bgWrapper.style.cursor = 'pointer';
            bgWrapper.onclick = () => window.open(adTarget, '_blank');
        }
        loadArticleAd();
</script>

</body>

</html>
