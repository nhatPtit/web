<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 468" width="225" height="468">
  <defs>
    <!-- Gradient dọc trùng màu .top-body .item2: linear-gradient(180deg, #991b1b → #dc2626) -->
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <!-- Shimmer overlay nhẹ -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Nền chính — hòa màu .top-body .item2 (cột sidebar phải trang chủ) -->
  <rect width="225" height="468" fill="url(#sidebar-grad)" rx="0"/>
  <!-- Shimmer -->
  <rect width="225" height="468" fill="url(#shimmer)" rx="0"/>

  <!-- Đường viền trên/dưới tinh tế -->
  <line x1="12" y1="1" x2="213" y2="1" stroke="#fca5a5" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="12" y1="467" x2="213" y2="467" stroke="#fca5a5" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Vùng QC chính: phần trên -->
  <rect x="14" y="20" width="197" height="200" rx="4" fill="none" stroke="#fca5a5" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 3"/>
  <text x="112" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fecaca" opacity="0.65">
    Quảng cáo
  </text>
  <text x="112" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5" opacity="0.5">
    Vị trí 2 · Top Sidebar
  </text>
  <text x="112" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5" opacity="0.4">
    225 × 200px
  </text>

  <!-- Divider -->
  <line x1="20" y1="234" x2="205" y2="234" stroke="#fca5a5" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Vùng QC chính: phần dưới -->
  <rect x="14" y="248" width="197" height="200" rx="4" fill="none" stroke="#fca5a5" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 3"/>
  <text x="112" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fecaca" opacity="0.65">
    Quảng cáo
  </text>
  <text x="112" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5" opacity="0.5">
    Vị trí 2 · Bottom Sidebar
  </text>
  <text x="112" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5" opacity="0.4">
    225 × 200px
  </text>

  <!-- Nhãn góc nhỏ -->
  <text x="112" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ef4444" opacity="0.4" letter-spacing="1">
    AD · PTEWS
  </text>
</svg>
