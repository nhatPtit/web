<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Gradient trùng màu nền .ad-background-wrapper trang chủ: linear-gradient(135deg, #0f172a → #1e3a5f → #2563eb) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="40%"  stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Overlay mờ nhẹ để phân vùng quảng cáo -->
    <linearGradient id="side-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Nền chính — hòa màu hoàn toàn với .ad-background-wrapper -->
  <rect width="1600" height="900" fill="url(#bg-grad)"/>

  <!-- Vùng lề trái: khu vực quảng cáo Background Takeover -->
  <rect x="0" y="0" width="185" height="900" fill="url(#side-fade)" opacity="0.9"/>
  <!-- Vùng lề phải -->
  <rect x="1415" y="0" width="185" height="900" fill="url(#side-fade)" opacity="0.9"/>

  <!-- Đường viền nhẹ phân chia vùng QC lề trái -->
  <line x1="185" y1="30" x2="185" y2="870" stroke="#2563eb" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4"/>
  <!-- Đường viền nhẹ phân chia vùng QC lề phải -->
  <line x1="1415" y1="30" x2="1415" y2="870" stroke="#2563eb" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4"/>

  <!-- Nhãn QC lề trái -->
  <text x="92" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#93c5fd" opacity="0.7" letter-spacing="1">
    Quảng cáo
  </text>
  <text x="92" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa" opacity="0.5" letter-spacing="0.5">
    Vị trí 1 · Lề trái
  </text>

  <!-- Nhãn QC lề phải -->
  <text x="1508" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#93c5fd" opacity="0.7" letter-spacing="1">
    Quảng cáo
  </text>
  <text x="1508" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa" opacity="0.5" letter-spacing="0.5">
    Vị trí 1 · Lề phải
  </text>

  <!-- Watermark trung tâm rất mờ — chỉ thấy khi không có nội dung đè lên -->
  <text x="800" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3b82f6" opacity="0.12" letter-spacing="3">
    PTEWS · AD POSITION 1 · BACKGROUND TAKEOVER
  </text>
</svg>
