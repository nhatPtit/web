<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Gradient trùng màu nền .ad-background-wrapper chi-tiet.css:
         linear-gradient(to top right, #0040FF 0%, #00EAFF 50%, #00FF2F 100%) -->
    <linearGradient id="bg-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0040FF"/>
      <stop offset="50%"  stop-color="#00EAFF"/>
      <stop offset="100%" stop-color="#00FF2F"/>
    </linearGradient>
    <!-- Overlay mờ nhẹ 2 bên lề -->
    <linearGradient id="side-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0040FF" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#00EAFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0040FF" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Nền chính — hòa màu hoàn toàn với .ad-background-wrapper trong chi-tiet.css -->
  <rect width="1600" height="900" fill="url(#bg-grad)"/>

  <!-- Vùng lề trái: khu vực quảng cáo Background Takeover -->
  <rect x="0" y="0" width="185" height="900" fill="url(#side-fade)" opacity="0.9"/>
  <!-- Vùng lề phải -->
  <rect x="1415" y="0" width="185" height="900" fill="url(#side-fade)" opacity="0.9"/>

  <!-- Đường viền nhẹ phân chia vùng QC lề trái -->
  <line x1="185" y1="30" x2="185" y2="870" stroke="#00EAFF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4"/>
  <!-- Đường viền nhẹ phân chia vùng QC lề phải -->
  <line x1="1415" y1="30" x2="1415" y2="870" stroke="#00EAFF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4"/>

  <!-- Nhãn QC lề trái -->
  <text x="92" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e0f9ff" opacity="0.7" letter-spacing="1">
    Quảng cáo
  </text>
  <text x="92" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b3f0ff" opacity="0.5" letter-spacing="0.5">
    Vị trí 3 · Lề trái
  </text>

  <!-- Nhãn QC lề phải -->
  <text x="1508" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e0f9ff" opacity="0.7" letter-spacing="1">
    Quảng cáo
  </text>
  <text x="1508" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b3f0ff" opacity="0.5" letter-spacing="0.5">
    Vị trí 3 · Lề phải
  </text>

  <!-- Watermark trung tâm rất mờ — chỉ thấy khi không có nội dung đè lên -->
  <text x="800" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#00EAFF" opacity="0.10" letter-spacing="3">
    PTEWS · AD POSITION 3 · CHI TIẾT BÀI BÁO
  </text>
</svg>
