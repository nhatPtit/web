<!DOCTYPE html>
<html lang="vi" style="font-family: Arial, Helvetica, sans-serif;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="img/logo-PTEWS.svg">
    <title>Kết quả tìm kiếm - PTEWS</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="chi-tiet.css">
    <link rel="stylesheet" href="footer.css">
    <style>
        :root {
            --BackColor: #ffffff;
            --LinkColor: #bb0000;
            --HeaderColor: #111827;
            --TextColor: #374151;
            --TextMuted: #6b7280;
            --FontNavSize: 14px;
            --FontFamilyBB: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .search-title-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--LinkColor);
            color: #111;
        }
    </style>
    <script src="js/amlich.js"></script>
    <script src="js/header.js"></script>
</head>

<body>
    <header id="header1-placeholder"></header>
    <nav class="sub-header1" id="header2-placeholder"></nav>

    <div class="ad-background-wrapper"></div>

    <div class="main-container" style="display: block; padding: 20px;">
        <div id="search-heading" class="search-title-header">Kết quả tìm kiếm</div>
        <div id="search-list" style="display: grid; gap: 20px;"></div>
    </div>
    <div id="loading-spinner" style="text-align: center; display: none; padding: 20px;">
        <p style="color: gray;">Đang tải thêm bài báo...</p>
    </div>

    <footer id="footer-placeholder"></footer>

    <script>
        fetch('header_1.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header1-placeholder').innerHTML = data;
                initHeader();
            });
        fetch('header_2.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header2-placeholder').innerHTML = data;
            });
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const container = document.getElementById('search-list');
            const headingEl = document.getElementById('search-heading');
            const loadingSpinner = document.getElementById('loading-spinner');

            if (!query || !query.trim()) {
                headingEl.textContent = 'Kết quả tìm kiếm';
                container.innerHTML = '<p style="text-align:center; color: #666; padding: 20px 0;">Vui lòng nhập từ khóa tìm kiếm trên thanh tìm kiếm!</p>';
                return;
            }

            headingEl.innerHTML = `Kết quả tìm kiếm cho: <span style="color: var(--LinkColor);">"${query.trim()}"</span>`;
            document.title = `Tìm kiếm: "${query.trim()}" - PTEWS`;

            let currentOffset = 0;
            let isLoading = false;
            let hasMoreData = true;

            async function fetchAndRenderSearchResults(offset) {
                if (isLoading || !hasMoreData) return;

                isLoading = true;
                loadingSpinner.style.display = 'block';

                try {
                    const response = await fetch(`http://localhost:3000/api/tim-kiem?q=${encodeURIComponent(query.trim())}&offset=${offset}`);
                    if (!response.ok) {
                        throw new Error("Lỗi khi tải kết quả tìm kiếm");
                    }
                    const articles = await response.json();

                    if (articles.length === 0) {
                        hasMoreData = false;
                        if (offset === 0) {
                            container.innerHTML = `<p style="text-align:center; color: #666; padding: 20px 0;">Không tìm thấy bài báo nào phù hợp với từ khóa "<strong>${query.trim()}</strong>".</p>`;
                        }
                    } else {
                        renderArticlesToDOM(articles, offset);
                        currentOffset += 5;
                        if (articles.length < 5) {
                            hasMoreData = false;
                        }
                    }
                } catch (error) {
                    console.error("Lỗi fetch tìm kiếm:", error);
                    if (offset === 0) {
                        container.innerHTML = '<p style="text-align:center; color: red;">Đã xảy ra lỗi khi kết nối với máy chủ.</p>';
                    }
                } finally {
                    isLoading = false;
                    loadingSpinner.style.display = 'none';
                }
            }

            function renderArticlesToDOM(articles, startOffset) {
                articles.forEach((article, index) => {
                    const globalIndex = startOffset + index;
                    const itemClass = `item${(globalIndex % 5) + 1}`;

                    const articleHTML = `
                        <div class="${itemClass} article-item" id="BB${article.ID_BB}" style="display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px;">
                            <div class="img-wrapper" style="flex: 0 0 30%;">
                                <a href="chi-tiet.html?id=${article.ID_BB}">
                                    <img src="${article.AnhBia ? `.${article.AnhBia}` : 'default.jpg'}" alt="${article.TieuDe}" style="width: 100%; height: auto; border-radius: 4px; object-fit: cover; aspect-ratio: 16/9;">
                                </a>
                            </div>
                            <div class="content-wrapper" style="flex: 1;">
                                <h3 style="margin-top: 0; font-size: 18px;">
                                    <a href="chi-tiet.html?id=${article.ID_BB}" style="text-decoration: none; color: #333;">${article.TieuDe}</a>
                                </h3>
                                <a href="chi-tiet.html?id=${article.ID_BB}" style="text-decoration: none; color: #666; font-size: 14px; display: block; margin-top: 8px;">${article.TomTat}</a>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', articleHTML);
                });
            }

            // Lắng nghe sự kiện cuộn trang (Infinite Scroll)
            window.addEventListener('scroll', () => {
                const isNearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 100;
                if (isNearBottom && !isLoading && hasMoreData) {
                    fetchAndRenderSearchResults(currentOffset);
                }
            });

            // Tải kết quả đợt đầu tiên
            fetchAndRenderSearchResults(0);
        });
    </script>
</body>
</html>
