<!DOCTYPE html>
<html lang="vi" style="font-family: Arial, Helvetica, sans-serif;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTEWS</title>
    <link rel="icon" type="image/svg" href="img/logo-PTEWS.svg">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="body.css">
    <link rel="stylesheet" href="footer.css">
    <style>
        :root {
            --BackColor: #ffffff;
            --LinkColor: #bb0000;
            --HeaderColor: #111827;
            --TextColor: #374151;
            --TextMuted: #6b7280;

            --FontNavSize: 14px;
            --FontHeader1: 18px;
            --FontHeader2: 14.5px;
            --FontConten1: 13.5px;
            --FontConten2: 12px;

            --FontFamilyBB: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            --FontFamilyBB2: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

            --LineHeaderHigh: 1.5;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <script src="js/amlich.js"></script>
    <script src="js/header.js"></script>

</head>

<body>
    <header id="header1-placeholder"></header>
    <nav class="sub-header1" id="header2-placeholder"></nav>
    <main id="body-placeholder"></main>
    <footer id="footer-placeholder"></footer>

    <script>
        // 2. Nạp header_1.html và khởi tạo Lịch + Thời tiết
        fetch('header_1.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header1-placeholder').innerHTML = data;
                initHeader();
            });

        fetch('body.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('body-placeholder').innerHTML = data;
                fetchAndDrawChart();
                fetchAndDrawChartXang();
                fetchTopNews();
                loadHomeAds();
            });
        fetch('header_2.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header2-placeholder').innerHTML = data;
            });
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });


        async function fetchAndDrawChart() {
            try {
                const canvas = document.getElementById('myChart');
                // Trang này không có biểu đồ
                if (!canvas) return;
                const response = await fetch('/api/gia-vang2');
                const apiData = await response.json();
                new Chart(canvas, {
                    type: "line",

                    data: {
                        labels: apiData.xValues,

                        datasets: [
                            {
                                label: "SJC Mua vào",
                                data: apiData.sjcBuy,
                                borderColor: "red",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            },
                            {
                                label: "SJC Bán ra",
                                data: apiData.sjcSell,
                                borderColor: "orange",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            },
                            {
                                label: "Bảo Tín Mua vào",
                                data: apiData.nhanBuy,
                                borderColor: "blue",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            },
                            {
                                label: "Bảo Tín Bán ra",
                                data: apiData.nhanSell,
                                borderColor: "green",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            }
                        ]
                    },

                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    usePointStyle: true,
                                    boxWidth: 2,
                                    boxHeight: 2,
                                    font: {
                                        size: 11
                                    },
                                    padding: 5
                                },
                                position: 'top'
                            }
                        },
                        scales: {
                            y: {
                                title: {
                                    display: true,
                                    text: "VNĐ/lượng"
                                }
                            },
                            x: {
                                ticks: {
                                    display: true,
                                    maxTicksLimit: 4,
                                },
                                grid: {
                                    display: true
                                }
                            }
                        }
                    }
                });
            }
            catch (error) {
                console.error("Lỗi khi tải biểu đồ:", error);
            }

        }
        async function fetchAndDrawChartXang() {
            try {

                // 1. Gọi API backend
                const response = await fetch(
                    '/api/gia-Xang/lich-su-gia-xang'
                );

                // 2. Chuyển dữ liệu JSON
                const apiData = await response.json();

                // 3. Lấy mảng data
                const data = apiData.data;

                // 4. Tách ngày và giá
                const xValues = data.map(item => item.date);
                const prices = data.map(item => item.price);

                // 5. Lấy canvas
                const ctx = document.getElementById('Xang-Chart');

                // 6. Vẽ biểu đồ
                new Chart(ctx, {
                    type: "line",

                    data: {
                        labels: xValues,

                        datasets: [
                            {
                                label: "Xăng E10 RON 95-III",
                                data: prices,
                                borderColor: "red",
                                borderWidth: 1,
                                pointRadius: 1,
                                tension: 0.1
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    usePointStyle: true,
                                    boxWidth: 2,
                                    boxHeight: 2,
                                    font: {
                                        size: 11
                                    },
                                    padding: 5
                                },
                                position: 'top'
                            }
                        },

                        scales: {
                            y: {
                                beginAtZero: false,
                                title: {
                                    display: true,
                                    text: "VNĐ/lít"
                                }
                            },

                            x: {
                                ticks: {
                                    display: true,
                                    maxTicksLimit: 6,
                                },
                                grid: {
                                    display: true
                                }
                            }
                        }
                    }
                });

            } catch (error) {

                console.error(
                    "Lỗi khi tải dữ liệu từ server:",
                    error
                );

                alert(
                    "Không thể tải dữ liệu giá xăng. Vui lòng kiểm tra server backend."
                );
            }
        }


        async function fetchTopNews() {
            try {

                const response = await fetch('/api/lay-home-db');
                const newsData = await response.json();

                const targetIds = ['BB1', 'BB3', 'BB4', 'BB5', 'BB6', 'BB7'];

                let ContainerID = document.getElementById(targetIds[0]);
                if (ContainerID) {
                    const news = newsData[0];
                    const htmlContent = `
                        <div id="BB1-container">
                            <div id="BB1-img">
                                <a href="chi-tiet.html?id=${news.ID_BB}" style="text-decoration: none;">
                                    ${news.AnhBia ? `<img src=".${news.AnhBia}" alt="Lỗi ảnh">` : ''}
                                </a>
                            </div>
                            <div id="BB1-subContainer">
                                <div id="BB1-title">
                                    <a href="chi-tiet.html?id=${news.ID_BB}" style="text-decoration: none;">
                                        <h3>${news.TieuDe}</h3>
                                    </a>
                                </div>
                                <div id="BB1-summary">
                                    <a href="chi-tiet.html?id=${news.ID_BB}" style="text-decoration: none;">
                                        <p>${news.TomTat}</p>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                    ContainerID.innerHTML = htmlContent;
                };

                newsData.forEach((news, index) => {
                    // Bỏ qua index = 0 vì đã xử lý riêng cho BB1
                    if (index > 0 && index < targetIds.length) {
                        const targetElement = document.getElementById(targetIds[index]);
                        if (targetElement) {
                            targetElement.innerHTML = `
                                <div class="bb34-container">
                                    <div class="bb34-title">
                                        <a href="chi-tiet.html?id=${news.ID_BB}" style="text-decoration: none;">
                                            <h3>${news.TieuDe}</h3>
                                        </a>
                                    </div>
                                    <div class="bb34-img">
                                        <a href="chi-tiet.html?id=${news.ID_BB}" style="text-decoration: none;"> 
                                            ${news.AnhBia ? `<img src=".${news.AnhBia}" alt="Lỗi ảnh">` : ''}
                                        </a>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu bài báo:", error);
            }
        }

        let currentOffset = 6; // Bắt đầu cuộn từ bài số 6 trở đi
        let isLoading = false; // Cờ chặn gọi API liên tục khi đang tải
        let hasMoreData = true; // Cờ dừng gọi API khi đã hết bài báo

        window.addEventListener('scroll', async () => {
            // Kích hoạt khi cuộn cách đáy trang khoảng 100px
            const isNearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 100;

            if (isNearBottom && !isLoading && hasMoreData) {
                isLoading = true;

                try {
                    // Gọi API với biến offset hiện tại
                    const response = await fetch(`/api/lay-body-db5?offset=${currentOffset}`);
                    const newArticles = await response.json();

                    if (newArticles.length === 0) {
                        // Nếu mảng trả về rỗng -> đã hết bài báo
                        hasMoreData = false;
                    } else {
                        // Render các bài báo mới ra giao diện
                        renderArticlesToDOM(newArticles);

                        // Tăng offset lên 5 để chuẩn bị cho lần cuộn tiếp theo
                        currentOffset += 5;
                    }
                } catch (error) {
                    console.error("Lỗi fetch dữ liệu:", error);
                } finally {
                    isLoading = false; // Mở khóa để có thể cuộn tiếp
                }
            }
        });


        function renderArticlesToDOM(articles) {
            const container = document.getElementById('body3'); // ID vùng chứa bài báo

            articles.forEach((article, index) => {
                // index bắt đầu từ 0, nên cần + 1 để thành item1, item2...
                // Dùng (index % 5) + 1 để nếu có load thêm (bài 6, 7...) nó vẫn quay lại class item1 - item5 cho đúng CSS Grid của bạn.
                const itemClass = `item${(index % 5) + 1}`;

                const articleHTML = `
                <div class="${itemClass} article-item" id="BB${article.ID_BB}">
                    <div class="img-wrapper">
                        <!-- Link bọc riêng hình ảnh -->
                        <a href="chi-tiet.html?id=${article.ID_BB}">
                            <img src="${article.AnhBia ? `.${article.AnhBia}` : 'default.jpg'}" alt="${article.TieuDe}">
                        </a>
                    </div>
                    <div class="content-wrapper">
                        <h3>
                            <!-- Link bọc riêng tiêu đề -->
                            <a href="chi-tiet.html?id=${article.ID_BB}">${article.TieuDe}</a>
                        </h3>
                        <a href="chi-tiet.html?id=${article.ID_BB}">${article.TomTat}</a>
                        
                    </div>
                </div>
            `;
                container.insertAdjacentHTML('beforeend', articleHTML);
            });
        }


    
        // Tải và hiển thị quảng cáo vị trí 1 (Nền trang chủ) và vị trí 2 (Sidebar)
        async function loadHomeAds() {
            const defaultBgAd = 'AD_file/ad1-background-takeover.svg';
            const defaultSidebarAd = 'AD_file/ad2-top-sidebar-banner.svg';

            let activeAds = {};
            try {
                const response = await fetch('/api/auth-doanhnghiep/active-ads');
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data) {
                        activeAds = result.data;
                    }
                }
            } catch (err) {
                console.warn('Không tải được quảng cáo từ API, sử dụng mặc định:', err);
            }

            // 1. Vị trí 1: Nền trang chủ (ad-background-wrapper)
            const bgWrapper = document.querySelector('#body-placeholder .ad-background-wrapper') || document.querySelector('.ad-background-wrapper');
            if (bgWrapper) {
                const ad1 = activeAds[1];
                const ad1Url = (ad1 && ad1.media_url) ? ad1.media_url : defaultBgAd;
                bgWrapper.style.backgroundImage = `url('${ad1Url}')`;
                bgWrapper.style.backgroundRepeat = 'no-repeat';
                bgWrapper.style.backgroundPosition = 'center top';
                bgWrapper.style.backgroundSize = 'cover';
                if (ad1 && ad1.target_url) {
                    bgWrapper.style.cursor = 'pointer';
                    bgWrapper.onclick = () => window.open(ad1.target_url, '_blank');
                }
            }

            // 2. Vị trí 2: Top Sidebar Banner (top-sidebar-ad)
            const sidebarAdEl = document.getElementById('top-sidebar-ad') || document.querySelector('.top-body .item2');
            if (sidebarAdEl) {
                const ad2 = activeAds[2];
                const ad2Img = (ad2 && ad2.media_url) ? ad2.media_url : defaultSidebarAd;
                const ad2Link = (ad2 && ad2.target_url) ? ad2.target_url : 'connect-to-ad.html';

                sidebarAdEl.innerHTML = `
                    <a href="${ad2Link}" target="_blank" title="Quảng cáo PTEWS">
                        <img src="${ad2Img}" alt="Quảng cáo PTEWS">
                    </a>
                `;
            }
        }
</script>

</body>

</html>
