<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giá vàng</title>
</head>

<body>

    <h1>Giá vàng hôm nay</h1>

    <div id="gold-price">
        Đang tải dữ liệu...
    </div>

    <script>
        // Frontend gọi API qua Backend
        fetch('http://localhost:3000/api/gia-vang')
            .then(response => response.json())
            .then(data => {

                // Lấy phần tử đầu tiên trong results
                const gold = data.results[0];

                // Hiển thị dữ liệu
                document.getElementById('gold-price').innerHTML = `
                    <p>Giá mua 1 chỉ: ${gold.buy_1c}</p>
                    <p>Giá bán 1 chỉ: ${gold.sell_1c}</p>

                    <p>Giá mua 1 lượng: ${gold.buy_1l}</p>
                    <p>Giá bán 1 lượng: ${gold.sell_1l}</p>
                    <p>Giá mua nữ trang9999: ${gold.buy_nutrang_9999}</p>
                    <p>Giá bán nữ trang9999: ${gold.sell_nutrang_9999}</p>
                `;
            })
            .catch(error => {
                console.error(error);

                document.getElementById('gold-price').innerHTML =
                    'Không thể lấy dữ liệu giá vàng';
            });
    </script>

</body>

</html>
