<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Biểu đồ Giá Xăng</title>

    <!-- Nhúng thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
</head>

<body>

    <canvas id="Xang-Chart" style="width:100%;max-width:800px"></canvas>

    <script>
        // Gọi API rồi vẽ biểu đồ
        async function fetchAndDrawChartXang() {
            try {

                // 1. Gọi API backend
                const response = await fetch(
                    'http://localhost:3000/api/gia-Xang/lich-su-gia-xang'
                );

                // 2. Chuyển dữ liệu JSON
                const apiData = await response.json();

                // 3. Lấy mảng data
                const data = apiData.data;

                // 4. Tách ngày và giá
                const xValues = data.map(item => item.date);
                const prices = data.map(item => item.price);

                // 5. Lấy canvas
                const ctx = document.getElementById('Xang-Chart');

                // 6. Vẽ biểu đồ
                new Chart(ctx, {
                    type: "line",

                    data: {
                        labels: xValues,

                        datasets: [
                            {
                                label: "Xăng E10 RON 95-III",
                                data: prices,
                                borderColor: "red",
                                pointRadius: 3,
                                tension: 0.1
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        plugins: {
                            legend: {
                                display: true
                            }
                        },

                        scales: {
                            y: {
                                beginAtZero: false,
                                title: {
                                    display: true,
                                    text: "Giá (VNĐ/lít)"
                                }
                            },

                            x: {
                                title: {
                                    display: true,
                                    text: "Ngày"
                                }
                            }
                        }
                    }
                });

            } catch (error) {

                console.error(
                    "Lỗi khi tải dữ liệu từ server:",
                    error
                );

                alert(
                    "Không thể tải dữ liệu giá xăng. Vui lòng kiểm tra server backend."
                );
            }
        }

        // Chạy khi trang load
        fetchAndDrawChartXang();

    </script>

</body>

</html>
