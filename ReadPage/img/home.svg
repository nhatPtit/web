<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="home-icon">
  <style>
    /* Kiểu dáng mặc định */
    .home-icon {
      width: 60px;
      height: 60px;
      cursor: pointer;
    }

    .home-bg {
      fill: #EBEBEB;
      transition: fill 0.3s ease;
    }

    .home-shape {
      fill: #666666;
      transition: fill 0.3s ease;
    }

    /* Hiệu ứng khi rê chuột (Hover) */
    .home-icon:hover .home-bg {
      fill: #C2185B; /* Màu nền khi hover */
    }

    .home-icon:hover .home-shape {
      fill: #FFFFFF; /* Màu ngôi nhà khi hover */
    }
  </style>

  <!-- Nền hình tròn -->
  <circle class="home-bg" cx="50" cy="50" r="48" />

  <!-- Biểu tượng ngôi nhà -->
  <path class="home-shape" d="
    M 50,26 
    L 28,42 
    A 3,3 0 0,0 27,45.5 
    V 70 
    a 4,4 0 0,0 4,4 
    h 11 
    a 2,2 0 0,0 2,-2 
    V 54 
    a 2,2 0 0,1 2,-2 
    h 8 
    a 2,2 0 0,1 2,2 
    v 18 
    a 2,2 0 0,0 2,2 
    h 11 
    a 4,4 0 0,0 4,-4 
    V 45.5 
    a 3,3 0 0,0 -1,-3.5 
    Z
  " />
</svg>