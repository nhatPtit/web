        async function fetchAndDrawChart() {
            try {
                const canvas = document.getElementById('myChart');

                // Trang này không có biểu đồ
                if (!canvas) return;

                const response = await fetch('http://localhost:3000/api/gia-vang2');
                const apiData = await response.json();

                new Chart(canvas, {
                    type: "line",

                    data: {
                        labels: apiData.xValues,

                        datasets: [
                            {
                                label: "SJC Mua vào",
                                data: apiData.sjcBuy,
                                borderColor: "red",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            },
                            {
                                label: "SJC Bán ra",
                                data: apiData.sjcSell,
                                borderColor: "orange",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            },
                            {
                                label: "Bảo Tín Mua vào",
                                data: apiData.nhanBuy,
                                borderColor: "blue",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            },
                            {
                                label: "Bảo Tín Bán ra",
                                data: apiData.nhanSell,
                                borderColor: "green",
                                pointRadius: 1,
                                borderWidth: 1,
                                tension: 0.1
                            }
                        ]
                    },

                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    usePointStyle: true,
                                    boxWidth: 2,
                                    boxHeight: 2,
                                    font: {
                                        size: 11
                                    },
                                    padding: 5
                                },
                                position: 'top'
                            }
                        },
                        scales: {
                            y: {
                                title: {
                                    display: true,
                                    text: "VNĐ/lượng"
                                }
                            },
                            x: {
                                ticks: {
                                    display: true,
                                    maxTicksLimit: 4,
                                },
                                grid: {
                                    display: true
                                }
                            }
                        }
                    }
                });
            }
            catch (error) {
                console.error("Lỗi khi tải biểu đồ:", error);
            }

        }
        async function fetchAndDrawChartXang() {
            try {

                // 1. Gọi API backend
                const response = await fetch(
                    'http://localhost:3000/api/gia-Xang/lich-su-gia-xang'
                );

                // 2. Chuyển dữ liệu JSON
                const apiData = await response.json();

                // 3. Lấy mảng data
                const data = apiData.data;

                // 4. Tách ngày và giá
                const xValues = data.map(item => item.date);
                const prices = data.map(item => item.price);

                // 5. Lấy canvas
                const ctx = document.getElementById('Xang-Chart');

                // 6. Vẽ biểu đồ
                new Chart(ctx, {
                    type: "line",

                    data: {
                        labels: xValues,

                        datasets: [
                            {
                                label: "Xăng E10 RON 95-III",
                                data: prices,
                                borderColor: "red",
                                borderWidth: 1,
                                pointRadius: 1,
                                tension: 0.1
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    usePointStyle: true,
                                    boxWidth: 2,
                                    boxHeight: 2,
                                    font: {
                                        size: 11
                                    },
                                    padding: 5
                                },
                                position: 'top'
                            }
                        },

                        scales: {
                            y: {
                                beginAtZero: false,
                                title: {
                                    display: true,
                                    text: "VNĐ/lít"
                                }
                            },

                            x: {
                                ticks: {
                                    display: true,
                                    maxTicksLimit: 6,
                                },
                                grid: {
                                    display: true
                                }
                            }
                        }
                    }
                });

            } catch (error) {

                console.error(
                    "Lỗi khi tải dữ liệu từ server:",
                    error
                );

                alert(
                    "Không thể tải dữ liệu giá xăng. Vui lòng kiểm tra server backend."
                );
            }
        }
