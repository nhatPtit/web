    .app-container {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column
    }

    :focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 3px;
      border-radius: 10px
    }

    /* Header */
    .header-wrapper {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--glass);
      border-bottom: 1px solid var(--line);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      padding-top: env(safe-area-inset-top, 0px)
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px clamp(16px, 4vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px
    }

    .logo-link {
      display: flex;
      align-items: center;
      border-radius: 12px;
      text-decoration: none
    }

    .logo-image {
      height: clamp(30px, 5vw, 40px);
      width: auto;
      display: block
    }

    .header-right-box {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0
    }

    .header-text {
      text-align: right;
      min-width: 0
    }

    .role-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      background: var(--acc-soft);
      color: var(--acc);
      font-size: .75rem;
      font-weight: 600
    }

    .header-role-title {
      margin: 2px 0 0;
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      font-weight: 600;
      line-height: 1.25
    }

    .theme-toggle {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--glass-strong);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .2s, border-color .2s
    }

    .theme-toggle:hover {
      border-color: var(--acc);
      color: var(--acc)
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px
    }

    .theme-toggle .i-sun {
      display: none
    }

    :root[data-theme="dark"] .theme-toggle .i-sun {
      display: block
    }

    :root[data-theme="dark"] .theme-toggle .i-moon {
      display: none
    }

    /* Main */
    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 5vw, 56px) clamp(14px, 4vw, 32px) calc(clamp(20px, 5vw, 56px) + env(safe-area-inset-bottom, 0px))
    }

    .content-container {
      width: 100%;
      display: flex;
      justify-content: center
    }

    .welcome-card,
    .login-card {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px)
    }

    .welcome-card {
      max-width: 720px;
      padding: clamp(28px, 6vw, 64px);
      text-align: center
    }

    .welcome-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--acc-soft);
      color: var(--acc);
      font-size: .85rem;
      font-weight: 600
    }

    .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor
    }

    .welcome-headline {
      margin: 22px 0 14px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2rem, 6.4vw, 3.6rem);
      line-height: 1.12;
      letter-spacing: -.01em
    }

    .welcome-subline {
      margin: 0 auto;
      max-width: 52ch;
      color: var(--mute);
      font-size: clamp(.95rem, 2.2vw, 1.08rem)
    }

    .welcome-actions {
      margin-top: clamp(24px, 4vw, 36px)
    }

    .btn-quick-entry,
    .btn-submit {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      background: var(--acc);
      color: var(--acc-ink);
      font: 600 1rem/1 var(--font-body);
      padding: 16px 36px;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s, transform .15s
    }

    .btn-quick-entry:hover,
    .btn-submit:hover {
      background: var(--acc-hover)
    }

    .btn-quick-entry:active,
    .btn-submit:active {
      transform: translateY(1px)
    }

    /* Đăng nhập */
    .login-card {
      max-width: 440px;
      padding: clamp(26px, 5vw, 44px)
    }

    .login-logo {
      display: block;
      height: clamp(64px, 14vw, 84px);
      width: auto;
      margin: 0 auto 18px
    }

    .login-title {
      margin: 0 0 8px;
      text-align: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.5rem, 5vw, 1.85rem);
      line-height: 1.2
    }

    .login-lead {
      margin: 0 0 26px;
      text-align: center;
      color: var(--mute);
      font-size: .95rem
    }

    .form-group {
      margin-bottom: 20px
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: .9rem
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      transition: border-color .2s, box-shadow .2s
    }

    .form-group input::placeholder {
      color: var(--mute);
      opacity: .75
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--acc);
      box-shadow: 0 0 0 4px var(--acc-soft)
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 14px
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 26px 0 20px
    }

    .footer-text {
      text-align: center;
      color: var(--mute);
      font-size: .85rem
    }

    @media (max-width:560px) {
      .header-content {
        padding-top: 10px;
        padding-bottom: 10px;
        gap: 10px
      }

      .header-right-box {
        gap: 10px
      }

      .role-badge {
        font-size: .7rem;
        padding: 2px 10px
      }

      .welcome-card,
      .login-card {
        border-radius: 22px
      }

      .btn-quick-entry {
        display: block;
        width: 100%
      }
    }

    @media (max-width:380px) {
      .header-text {
        display: none
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }

    :root {
      --ok: #15803d;
      --ok-soft: rgba(21, 128, 61, .12);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, .12)
    }

    :root[data-theme="dark"] {
      --ok: #4ade80;
      --ok-soft: rgba(74, 222, 128, .14);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, .14)
    }

    .ws {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(14px, 3vw, 28px);
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 16px;
      align-items: start
    }

    .nav,
    .panel {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px)
    }

    .nav {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 90px
    }

    .nav button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      color: var(--ink);
      font: 600 .95rem var(--font-body);
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer
    }

    .nav button:hover {
      background: var(--acc-soft)
    }

    .nav button[aria-selected="true"] {
      background: var(--acc);
      color: var(--acc-ink)
    }

    .cnt {
      min-width: 24px;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--acc-soft);
      color: var(--acc);
      font-size: .78rem;
      text-align: center
    }

    .nav button[aria-selected="true"] .cnt {
      background: rgba(255, 255, 255, .25);
      color: inherit
    }

    .panel {
      padding: clamp(16px, 3vw, 28px);
      min-height: 420px
    }

    .panel h2 {
      margin: 0 0 4px;
      font: 700 clamp(1.3rem, 3.4vw, 1.7rem) var(--font-display)
    }

    .sub {
      margin: 0 0 18px;
      color: var(--mute);
      font-size: .92rem
    }

    .list {
      display: grid;
      gap: 12px
    }

    .item {
      border: 1px solid var(--line);
      background: var(--glass-strong);
      border-radius: 16px;
      padding: 16px
    }

    .item h3 {
      margin: 0 0 6px;
      font-size: 1.02rem;
      line-height: 1.35
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      color: var(--mute);
      font-size: .82rem;
      margin-bottom: 8px
    }

    .item p {
      margin: 0 0 12px;
      color: var(--mute);
      font-size: .92rem
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .b {
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      font: 600 .88rem var(--font-body);
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer
    }

    .b:hover {
      border-color: var(--acc)
    }

    .b.ok {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff
    }

    :root[data-theme="dark"] .b.ok {
      color: #04210f
    }

    .b.no {
      color: var(--acc);
      border-color: var(--acc)
    }

    .reason {
      display: grid;
      gap: 8px;
      margin-top: 10px
    }

    .reason textarea,
    .tools input,
    .tools select {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      padding: 10px 12px
    }

    .reason textarea:focus,
    .tools input:focus,
    .tools select:focus {
      outline: none;
      border-color: var(--acc);
      box-shadow: 0 0 0 4px var(--acc-soft)
    }

    .ad {
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 84px;
      font-size: 1.05rem
    }

    .empty {
      padding: 40px 10px;
      text-align: center;
      color: var(--mute)
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 14px
    }

    .tw {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 16px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
      min-width: 620px
    }

    th,
    td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line)
    }

    th {
      color: var(--mute);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    tr:last-child td {
      border-bottom: 0
    }

    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 600
    }

    .tag.pub {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .tag.hide {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px
    }

    .kpi {
      border: 1px solid var(--line);
      background: var(--glass-strong);
      border-radius: 16px;
      padding: 14px 16px
    }

    .kpi b {
      display: block;
      font: 700 1.8rem var(--font-display)
    }

    .kpi span {
      color: var(--mute);
      font-size: .84rem
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px
    }

    .card {
      border: 1px solid var(--line);
      background: var(--glass-strong);
      border-radius: 16px;
      padding: 16px
    }

    .card h3 {
      margin: 0 0 14px;
      font-size: 1rem
    }

    .hb {
      display: grid;
      grid-template-columns: 90px 1fr 64px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      font-size: .85rem
    }

    .bar {
      height: 12px;
      border-radius: 999px;
      background: var(--acc-soft);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--acc);
      border-radius: 999px
    }

    .cols {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 170px
    }

    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 6px;
      font-size: .75rem;
      color: var(--mute)
    }

    .col i {
      flex: none;
      width: 100%;
      background: var(--acc);
      border-radius: 8px 8px 4px 4px;
      min-height: 4px
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 30px);
      opacity: 0;
      background: var(--ink);
      color: var(--glass-strong);
      padding: 11px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .9rem;
      transition: .25s;
      pointer-events: none;
      z-index: 20;
      max-width: 90vw
    }

    #toast.on {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    @media(max-width:820px) {
      .ws {
        grid-template-columns: 1fr
      }

      .nav {
        position: static;
        flex-direction: row;
        overflow-x: auto;
        border-radius: 16px
      }

      .nav button {
        white-space: nowrap;
        width: auto
      }

      .tools {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

        { id: 2, t: "Đề xuất khai thác tạm 62 km cao tốc qua Lạng Sơn", c: "Kinh tế", d: "28/09/2026", v: 9870, st: "pub" },
        { id: 3, t: "Tháo dỡ quả cầu 18 tấn ở cửa ngõ TP HCM", c: "Thời sự", d: "04/10/2026", v: 7310, st: "pub" },
        { id: 4, t: "Nhóm luật sư tinh hoa của Man City", c: "Thể thao", d: "05/10/2026", v: 5200, st: "pub" },
        { id: 5, t: "Lễ hội ẩm thực đường phố cuối tuần này", c: "Văn hóa", d: "07/10/2026", v: 3890, st: "hide" }],
      days: [["T2", 820], ["T3", 910], ["T4", 760], ["T5", 1130], ["T6", 980], ["T7", 1240], ["CN", 1060]]
    };
    var S = { tab: "art", ret: null, done: 0, back: 0, q: "", cat: "" };
    var TABS = [["art", "Duyệt bài"], ["ads", "Duyệt mẫu quảng cáo"], ["pub", "Quản lý bài đã đăng"], ["st", "Xem thống kê"]];
    var $ = function (i) { return document.getElementById(i) }, nf = function (n) { return n.toLocaleString("vi-VN") };
    function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.k); toast.k = setTimeout(function () { t.classList.remove("on") }, 2200) }
    function nav() {
      var c = { art: D.art.length, ads: D.ads.length, pub: D.pub.length };
      $("nav").innerHTML = TABS.map(function (t) { return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + (c[t[0]] != null ? '<span class="cnt">' + c[t[0]] + '</span>' : '') + '</button>' }).join("")
    }
    function vArt() {
      var h = '<h2>Duyệt bài</h2><p class="sub">Bài nhà báo gửi lên đang chờ bạn kiểm duyệt.</p>';
      if (!D.art.length) return h + '<div class="empty">Không còn bài nào chờ duyệt. 🎉</div>';
      return h + '<div class="list">' + D.art.map(function (a) {
        return '<article class="item"><h3>' + a.t + '</h3><div class="meta"><span>' + a.a + '</span><span>' + a.c + '</span><span>' + a.d + '</span></div><p>' + a.s + '</p><div class="row"><button class="b ok" data-act="ok-art" data-id="' + a.id + '">Duyệt bài</button><button class="b no" data-act="ask" data-id="' + a.id + '">Yêu cầu sửa</button></div>' +
          (S.ret === a.id ? '<div class="reason"><label for="rs" class="meta">Ghi chú chi tiết vị trí cần sửa</label><textarea id="rs" rows="3" placeholder="Nhập ghi chú chi tiết về vị trí cần sửa (ví dụ: tiêu đề, nội dung, hình ảnh)..."></textarea><div class="row"><button class="b no" data-act="back-art" data-id="' + a.id + '">Xác nhận trả lại</button><button class="b" data-act="cancel">Hủy</button></div></div>' : '') + '</article>'
      }).join("") + '</div>'
    }
    function vAds() {
      var h = '<h2>Duyệt mẫu quảng cáo</h2><p class="sub">Kiểm tra nội dung, kích thước và vị trí trước khi cho hiển thị.</p>';
      if (!D.ads.length) return h + '<div class="empty">Không có mẫu quảng cáo nào chờ duyệt.</div>';
      return h + '<div class="list">' + D.ads.map(function (a) { return '<article class="item"><div class="ad" style="background:' + a.bg + '">' + a.n + '</div><div class="meta"><span>' + a.adv + '</span><span>' + a.sz + '</span><span>Vị trí: ' + a.pos + '</span></div><div class="row"><button class="b ok" data-act="ok-ad" data-id="' + a.id + '">Duyệt mẫu</button><button class="b no" data-act="no-ad" data-id="' + a.id + '">Từ chối</button></div></article>' }).join("") + '</div>'
    }
    function vPub() {
      var cats = [], r; D.pub.forEach(function (p) { if (cats.indexOf(p.c) < 0) cats.push(p.c) });
      r = D.pub.filter(function (p) { return (!S.cat || p.c === S.cat) && p.t.toLowerCase().indexOf(S.q.toLowerCase()) >= 0 });
      return '<h2>Quản lý bài đã đăng</h2><p class="sub">Tìm, gỡ xuống hoặc đăng lại các bài đã xuất bản.</p><div class="tools"><input id="q" type="search" placeholder="Tìm theo tiêu đề" aria-label="Tìm theo tiêu đề" value="' + S.q.replace(/"/g, "") + '"><select id="cat" aria-label="Chuyên mục"><option value="">Mọi chuyên mục</option>' + cats.map(function (c) { return '<option' + (S.cat === c ? ' selected' : '') + '>' + c + '</option>' }).join("") + '</select></div>' +
        (r.length ? '<div class="tw"><table><thead><tr><th>Tiêu đề</th><th>Chuyên mục</th><th>Ngày đăng</th><th>Lượt xem</th><th>Trạng thái</th><th></th></tr></thead><tbody>' + r.map(function (p) { return '<tr><td>' + p.t + '</td><td>' + p.c + '</td><td>' + p.d + '</td><td>' + nf(p.v) + '</td><td><span class="tag ' + p.st + '">' + (p.st === "pub" ? "Đang hiển thị" : "Đã gỡ") + '</span></td><td><button class="b ' + (p.st === "pub" ? "no" : "ok") + '" data-act="tog" data-id="' + p.id + '">' + (p.st === "pub" ? "Gỡ bài" : "Đăng lại") + '</button></td></tr>' }).join("") + '</tbody></table></div>' : '<div class="empty">Không tìm thấy bài phù hợp.</div>')
    }
    function vSt() {
      var tot = 0, by = {}, mx = 1, dm = 1; D.pub.forEach(function (p) { tot += p.v; by[p.c] = (by[p.c] || 0) + p.v });
      Object.keys(by).forEach(function (k) { mx = Math.max(mx, by[k]) }); D.days.forEach(function (d) { dm = Math.max(dm, d[1]) });
      var live = D.pub.filter(function (p) { return p.st === "pub" }).length;
      var k = [[D.art.length, "Bài chờ duyệt"], [D.ads.length, "Mẫu QC chờ duyệt"], [live, "Bài đang hiển thị"], [nf(tot), "Tổng lượt xem"], [S.done + " / " + S.back, "Đã duyệt / trả lại (phiên này)"]];
      return '<h2>Xem thống kê</h2><p class="sub">Tổng quan nhanh về hoạt động kiểm duyệt và lượt đọc.</p><div class="kpis">' + k.map(function (x) { return '<div class="kpi"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>' }).join("") + '</div><div class="charts"><div class="card"><h3>Lượt xem theo chuyên mục</h3>' + Object.keys(by).map(function (c) { return '<div class="hb"><span>' + c + '</span><div class="bar"><i style="width:' + Math.round(by[c] / mx * 100) + '%"></i></div><b>' + nf(by[c]) + '</b></div>' }).join("") + '</div><div class="card"><h3>Lượt xem 7 ngày gần nhất</h3><div class="cols">' + D.days.map(function (d) { return '<div class="col"><span>' + nf(d[1]) + '</span><i style="height:' + Math.round(d[1] / dm * 72) + '%"></i><span>' + d[0] + '</span></div>' }).join("") + '</div></div></div>'
    }
    function draw() { nav(); $("panel").innerHTML = { art: vArt, ads: vAds, pub: vPub, st: vSt }[S.tab]() }
    function pull(arr, id) { for (var i = 0; i < arr.length; i++)if (arr[i].id == id) return arr.splice(i, 1)[0] }
    document.addEventListener("click", function (e) {
      var el = e.target.closest("[data-tab],[data-act]"); if (!el) return; var id = el.dataset.id, a = el.dataset.act, x;
      if (el.dataset.tab) { S.tab = el.dataset.tab; S.ret = null; return draw() }
      if (a === "ok-art") {
        var pos = prompt("Chọn vị trí nổi bật để đăng bài:\n1. Vị trí 1\n2. Vị trí 2\n3. Vị trí 3\nĐể đăng thường, läm trống hoặc nhập 0.", "");
        var featuredPos = null;
        if (pos && !isNaN(pos)) {
          var p = parseInt(pos);
          if (p >= 1 && p <= 3) featuredPos = p;
        }
        x = pull(D.art, id);
        x.featuredPos = featuredPos;
        D.pub.unshift({ id: x.id, t: x.t, c: x.c, d: x.d, v: 0, st: "pub", featuredPos: x.featuredPos });
        S.done++;
        toast("Đã duyệt và đăng bài" + (featuredPos ? " tại vị trí nổi bật " + featuredPos : ""));
      }
      else if (a === "ask") { S.ret = +id; draw(); var r = $("rs"); if (r) r.focus(); return }
      else if (a === "cancel") { S.ret = null }
      else if (a === "back-art") { if (!$("rs").value.trim()) { toast("Vui lòng nhập lý do trả lại"); return } pull(D.art, id); S.ret = null; S.back++; toast("Đã trả bài về cho tác giả") }
      else if (a === "ok-ad") { pull(D.ads, id); toast("Đã duyệt mẫu quảng cáo") }
      else if (a === "no-ad") { pull(D.ads, id); toast("Đã từ chối mẫu quảng cáo") }
      else if (a === "tog") { D.pub.forEach(function (p) { if (p.id == id) { p.st = p.st === "pub" ? "hide" : "pub"; toast(p.st === "pub" ? "Đã đăng lại bài" : "Đã gỡ bài xuống") } }) }
      draw()
    });
    document.addEventListener("input", function (e) { if (e.target.id === "q") { S.q = e.target.value; var p = e.target.selectionStart; draw(); var q = $("q"); q.focus(); q.setSelectionRange(p, p) } });
    document.addEventListener("change", function (e) { if (e.target.id === "cat") { S.cat = e.target.value; draw() } });
    draw();

    // Đọc phiên đăng nhập từ localStorage
    (function () {
      var currentUser = null;
      try {
        var u = localStorage.getItem("ptews_user");
        if (u) currentUser = JSON.parse(u);
      } catch (e) { }

      if (currentUser && currentUser.fullName) {
        var rb = document.getElementById("role-badge");
        if (rb) rb.textContent = "Kiểm duyệt viên: " + currentUser.fullName;
      }

      var outBtn = document.getElementById("btn-logout");
      if (outBtn) {
        outBtn.addEventListener("click", function () {
          try { localStorage.removeItem("ptews_user"); } catch (e) { }
          toast("Đã đăng xuất. Đang quay lại trang đăng nhập...");
          setTimeout(function () { window.location.href = "login.html"; }, 500);
        });
      }
    })();
  </script>
  <script>
    (function () {
      var b = document.getElementById("theme-toggle"); if (!b) return;
      b.addEventListener("click", function () { var r = document.documentElement, n = r.getAttribute("data-theme") === "dark" ? "light" : "dark"; r.setAttribute("data-theme", n); try { localStorage.setItem("ptews-theme", n) } catch (e) { } });
    })();
  </script>
</body>

</html>
