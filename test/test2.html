<!DOCTYPE html>
<html>
<style>
/* 1. Thay thẻ form bằng class .form-container */
.form-container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

.form-label {
  display: block;
}

/* 2. Thay input[type=text] và select bằng class .form-control */
.form-control {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

/* 3. Thay input[type=submit] bằng class .btn-submit */
.btn-submit {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* 4. Thay input[type=submit]:hover bằng .btn-submit:hover */
.btn-submit:hover {
  background-color: #45a049;
}
</style>
<body>

<h2>Style an HTML Form with CSS</h2>

<form action="/action_page.php" class="form-container">
  <label for="fname" class="form-label">First Name</label>
  <input type="text" id="fname" name="firstname" placeholder="Your name.." class="form-control">

  <label for="lname" class="form-label">Last Name</label>
  <input type="text" id="lname" name="lastname" placeholder="Your last name.." class="form-control">

  <label for="country" class="form-label">Country</label>
  <select id="country" name="country" class="form-control">
    <option value="australia">Australia</option>
    <option value="canada">Canada</option>
    <option value="usa">USA</option>
  </select>
  
  <input type="submit" value="Submit" class="btn-submit">
</form>

</body>
</html>
